<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariage Amir & Lylia</title>

<!-- Instagram / Social Media Preview Tags -->
<meta property="og:title" content="Mariage Amir & Lylia" />
<meta property="og:description" content="Vous êtes conviés à la célébration de notre mariage le Vendredi 29 Janvier 2027." />
<!-- Replace the content below with a direct .jpg link to the image you saved -->
<meta property="og:image" content="image.jpg" />
<meta property="og:url" content="https://YOUR-DOMAIN.com" />
<meta property="og:type" content="website" />

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    var(--env-w): min(85vw, 450px);
    var(--env-h): min(55vh, 300px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #2e0808 0%, #110000 70%, #000000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    perspective: 1500px;
  }

  .bokeh-container { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bokeh {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0) 70%);
    animation: drift 14s infinite ease-in-out alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) scale(0.9); opacity: 0.2; }
    to { transform: translateY(-80px) scale(1.2); opacity: 0.6; }
  }

  .bird-container {
    position: fixed; z-index: 5; pointer-events: none;
    animation: fly-across infinite linear; opacity: 0;
  }
  .bird-1 { top: 15%; animation-duration: 16s; animation-delay: 0s; transform: scale(1); }
  .bird-2 { top: 30%; animation-duration: 20s; animation-delay: 4s; transform: scale(0.8); }
  .bird-3 { top: 10%; animation-duration: 22s; animation-delay: 8s; transform: scale(1.2); }

  @keyframes fly-across {
    0% { left: -10%; transform: translateY(5vh); opacity: 0; }
    5% { opacity: 0.8; }
    95% { opacity: 0.8; }
    100% { left: 110%; transform: translateY(-15vh); opacity: 0; }
  }

  .bird-svg { width: 60px; height: 50px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5)); }
  .left-wing, .right-wing { transform-origin: 25px 20px; }
  .left-wing { animation: flap-left 0.4s infinite alternate ease-in-out; }
  .right-wing { animation: flap-right 0.4s infinite alternate ease-in-out; }
  @keyframes flap-left { from { transform: rotate(0deg); } to { transform: rotate(-45deg) translateY(-3px); } }
  @keyframes flap-right { from { transform: rotate(0deg); } to { transform: rotate(45deg) translateY(-3px); } }

  .stage {
    position: relative;
    width: min(85vw, 450px);
    height: min(55vh, 300px);
    z-index: 10;
  }

  .envelope {
    position: relative; width: 100%; height: 100%; cursor: pointer;
    transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.7)); 
  }

  .envelope-back {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #5c1616 0%, #3a0808 100%);
    border-radius: 4px;
  }

  .card {
    position: absolute; top: 15px; left: 4%; width: 92%; height: 90%;
    background: url('image_27da09.jpg') center/cover no-repeat;
    background-color: #fffcf8;
    border-radius: 2px;
    padding: 25px 15px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    z-index: 2;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
    transition: transform 1.3s cubic-bezier(0.25, 1, 0.3, 1), z-index 0.2s 0.6s, box-shadow 1.3s;
    pointer-events: none;
  }

  .names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    background: linear-gradient(75deg, #996515 0%, #f5d77f 30%, #b38728 50%, #fdf5b7 70%, #996515 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.15));
    margin-bottom: 5px;
  }

  .intro, .details {
    color: #4a3e35;
    text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.9);
  }

  .intro { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; }
  .details { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; line-height: 1.6; }
  
  .details .date {
    font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700;
    color: #611111; margin-top: 6px; display: block; letter-spacing: 1px;
  }

  .map-btn {
    display: inline-block; padding: 10px 22px; margin-top: 5px;
    background: linear-gradient(135deg, #d4af37, #f3e5ab, #b8860b);
    color: #2b0b0b; text-decoration: none; font-size: 0.75rem; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; border-radius: 3px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 1px 1px 1px rgba(255,255,255,0.6);
    pointer-events: auto; transition: transform 0.2s, box-shadow 0.2s; position: relative; z-index: 10;
  }
  .map-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3), inset 1px 1px 1px rgba(255,255,255,0.8); }

  .pocket-bottom {
    position: absolute; bottom: 0; left: 0; width: 0; height: 0;
    border-left: calc(min(85vw, 450px) / 2) solid transparent;
    border-right: calc(min(85vw, 450px) / 2) solid transparent;
    border-bottom: calc(min(55vh, 300px) * 0.58) solid #631717;
    z-index: 4; filter: drop-shadow(0 -3px 4px rgba(0,0,0,0.2));
  }

  .pocket-side {
    position: absolute; top: 0; width: 0; height: 0;
    border-top: calc(min(55vh, 300px) / 2) solid transparent;
    border-bottom: calc(min(55vh, 300px) / 2) solid transparent;
    z-index: 3;
  }
  .pocket-left { left: 0; border-left: calc(min(85vw, 450px) * 0.54) solid #731b1b; filter: drop-shadow(3px 0 4px rgba(0,0,0,0.15)); }
  .pocket-right { right: 0; border-right: calc(min(85vw, 450px) * 0.54) solid #561111; filter: drop-shadow(-3px 0 4px rgba(0,0,0,0.25)); }

  .flap-top {
    position: absolute; top: 0; left: 0; width: 0; height: 0;
    border-left: calc(min(85vw, 450px) / 2) solid transparent;
    border-right: calc(min(85vw, 450px) / 2) solid transparent;
    border-top: calc(min(55vh, 300px) * 0.58) solid #7a1d1d;
    transform-origin: top; transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 5; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
  }

  .wax-seal {
    position: absolute; bottom: -32px; left: -32px; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #b32424 0%, #7a1010 40%, #3d0404 100%);
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.5), inset 0 4px 6px rgba(255,255,255,0.3), 0 6px 10px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    color: #e6ca65; font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700;
    border: 1px solid #4a0808; transition: opacity 0.4s;
    text-shadow: -1px -1px 0px rgba(0,0,0,0.6), 1px 1px 0px rgba(255,255,255,0.2);
  }

  /* SMALLER OPEN STATE */
  .stage.open .envelope { transform: translateY(180px); }
  .stage.open .flap-top { transform: rotateX(180deg); z-index: 1; }
  .stage.open .wax-seal { opacity: 0; }
  .stage.open .card {
    /* Reduced scale from 1.6 to 1.35 */
    transform: translateY(-210px) scale(1.35) rotateX(2deg); 
    z-index: 20;
    box-shadow: 0 40px 60px rgba(0, 0, 0, 0.6), 0 15px 20px rgba(0, 0, 0, 0.4);
    pointer-events: auto;
  }

  .hint {
    position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.7); font-size: 0.75rem; letter-spacing: 2px;
    text-transform: uppercase; transition: opacity 0.4s;
  }
  .stage.open .hint { opacity: 0; }
</style>
</head>
<body>

<div class="bokeh-container" id="bokeh"></div>

<div class="bird-container bird-1">
  <svg class="bird-svg" viewBox="0 0 50 40">
    <path class="left-wing" d="M25 20 Q10 0 0 10 Q10 25 25 22" fill="#fffdfa"/>
    <path class="right-wing" d="M25 20 Q40 0 50 10 Q40 25 25 22" fill="#fffdfa"/>
    <ellipse cx="25" cy="21" rx="3.5" ry="9" fill="#f5ede0"/>
  </svg>
</div>
<div class="bird-container bird-2">
  <svg class="bird-svg" viewBox="0 0 50 40">
    <path class="left-wing" d="M25 20 Q10 0 0 10 Q10 25 25 22" fill="#fffdfa"/>
    <path class="right-wing" d="M25 20 Q40 0 50 10 Q40 25 25 22" fill="#fffdfa"/>
    <ellipse cx="25" cy="21" rx="3.5" ry="9" fill="#f5ede0"/>
  </svg>
</div>
<div class="bird-container bird-3">
  <svg class="bird-svg" viewBox="0 0 50 40">
    <path class="left-wing" d="M25 20 Q10 0 0 10 Q10 25 25 22" fill="#fffdfa"/>
    <path class="right-wing" d="M25 20 Q40 0 50 10 Q40 25 25 22" fill="#fffdfa"/>
    <ellipse cx="25" cy="21" rx="3.5" ry="9" fill="#f5ede0"/>
  </svg>
</div>

<div class="stage" id="stage" onclick="openEnvelope(event)">
  <div class="envelope">
    <div class="envelope-back"></div>

    <div class="card" id="card">
      <div class="intro">Entourés de l'amour de leurs familles</div>
      <div class="names">Amir & Lylia</div>
      <div class="details">
        Ont la joie de vous convier à la célébration de leur mariage
        <span class="date">Vendredi 29 Janvier 2027</span>
      </div>
      <a href="https://maps.app.goo.gl/yBpSWSQzhvKGWv729?g_st=ic" target="_blank" class="map-btn" onclick="event.stopPropagation()">
        Voir sur la carte
      </a>
    </div>

    <div class="pocket-left pocket-side"></div>
    <div class="pocket-right pocket-side"></div>
    <div class="pocket-bottom"></div>

    <div class="flap-top">
      <div class="wax-seal">A & L</div>
    </div>
  </div>
  <div class="hint">Appuyez pour ouvrir</div>
</div>

<script>
  const bokehContainer = document.getElementById('bokeh');
  for (let i = 0; i < 25; i++) {
    const b = document.createElement('div');
    b.className = 'bokeh';
    const size = Math.random() * 80 + 20;
    b.style.width = size + 'px'; b.style.height = size + 'px';
    b.style.top = Math.random() * 100 + 'vh'; b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDelay = (Math.random() * 8) + 's';
    bokehContainer.appendChild(b);
  }

  function playWeddingChimes() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const notes = [392.00, 493.88, 587.33, 739.99, 783.99, 987.77, 1174.66, 1479.98]; 
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + idx * 0.08 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.08 + 2.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.08); osc.stop(ctx.currentTime + idx * 0.08 + 2.5);
      });
    } catch (e) {}
  }

  let isOpen = false;
  function openEnvelope(e) {
    if (isOpen) return; isOpen = true;
    playWeddingChimes();
    document.getElementById('stage').classList.add('open');
  }
</script>
</body>
</html>
