<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariage Amir & Lylia</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #2e0808 0%, #150000 60%, #070000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    perspective: 1200px;
  }

  /* Bokeh background */
  .bokeh-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bokeh {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, rgba(212, 175, 55, 0) 70%);
    animation: drift 14s infinite ease-in-out alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) scale(0.9); opacity: 0.3; }
    to { transform: translateY(-80px) scale(1.2); opacity: 0.7; }
  }

  /* --- Visible Flying Birds --- */
  .bird-container {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    animation: fly-across infinite linear;
    opacity: 0;
  }
  
  .bird-1 { top: 15%; animation-duration: 16s; animation-delay: 0s; transform: scale(1); }
  .bird-2 { top: 30%; animation-duration: 20s; animation-delay: 4s; transform: scale(0.8); }
  .bird-3 { top: 10%; animation-duration: 22s; animation-delay: 8s; transform: scale(1.2); }
  .bird-4 { top: 25%; animation-duration: 18s; animation-delay: 12s; transform: scale(0.9); }

  @keyframes fly-across {
    0% { left: -10%; transform: translateY(5vh); opacity: 0; }
    5% { opacity: 0.9; }
    95% { opacity: 0.9; }
    100% { left: 110%; transform: translateY(-15vh); opacity: 0; }
  }

  .bird-svg {
    width: 60px;
    height: 50px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
  }
  
  .left-wing, .right-wing {
    transform-origin: 25px 20px;
  }
  .left-wing { animation: flap-left 0.4s infinite alternate ease-in-out; }
  .right-wing { animation: flap-right 0.4s infinite alternate ease-in-out; }

  @keyframes flap-left {
    from { transform: rotate(0deg); }
    to { transform: rotate(-45deg) translateY(-3px); }
  }
  @keyframes flap-right {
    from { transform: rotate(0deg); }
    to { transform: rotate(45deg) translateY(-3px); }
  }

  /* Envelope Stage */
  .stage {
    position: relative;
    width: min(92vw, 540px);
    height: min(65vh, 370px);
    z-index: 10;
  }

  .envelope {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .envelope-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #4d1010, #340707);
    border-radius: 8px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
  }

  /* Invitation Letter */
  .card {
    position: absolute;
    top: 15px;
    left: 4%;
    width: 92%;
    height: 90%;
    background: #fffdf9;
    border: 2px solid #d4af37;
    border-radius: 6px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 1.3s cubic-bezier(0.25, 1, 0.3, 1), z-index 0.2s 0.6s, box-shadow 1.3s;
    pointer-events: none;
  }

  .names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    background: linear-gradient(45deg, #996515, #f5d77f, #b38728, #fdf5b7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
    margin: 8px 0;
  }

  .intro {
    font-size: 0.82rem;
    letter-spacing: 2px;
    color: #7a6a58;
    text-transform: uppercase;
  }

  .details {
    font-family: 'Montserrat', sans-serif;
    color: #4a3b32;
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .details .date {
    font-family: 'Cinzel', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #7b1818;
    margin-top: 6px;
    display: block;
    letter-spacing: 1px;
  }

  .map-btn {
    display: inline-block;
    align-self: center;
    padding: 11px 26px;
    background: linear-gradient(45deg, #b8860b, #e6ca65, #b8860b);
    color: #3b0909;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 30px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    pointer-events: auto;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .map-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
  }

  /* Envelope Flaps */
  .pocket-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: calc(min(92vw, 540px) / 2) solid transparent;
    border-right: calc(min(92vw, 540px) / 2) solid transparent;
    border-bottom: calc(min(65vh, 370px) * 0.58) solid #561313;
    z-index: 4;
  }

  .pocket-side {
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-top: calc(min(65vh, 370px) / 2) solid transparent;
    border-bottom: calc(min(65vh, 370px) / 2) solid transparent;
    z-index: 3;
  }
  .pocket-left {
    left: 0;
    border-left: calc(min(92vw, 540px) * 0.54) solid #661818;
  }
  .pocket-right {
    right: 0;
    border-right: calc(min(92vw, 540px) * 0.54) solid #661818;
  }

  .flap-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: calc(min(92vw, 540px) / 2) solid transparent;
    border-right: calc(min(92vw, 540px) / 2) solid transparent;
    border-top: calc(min(65vh, 370px) * 0.58) solid #731b1b;
    transform-origin: top;
    transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 5;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
  }

  .wax-seal {
    position: absolute;
    bottom: -32px;
    left: -32px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, #991c1c 40%, #520808 100%);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 6px 14px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e6ca65;
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    border: 2px dashed rgba(230, 202, 101, 0.6);
    transition: opacity 0.4s;
  }

  /* Open State */
  .stage.open .envelope {
    transform: translateY(180px);
  }
  .stage.open .flap-top {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .stage.open .wax-seal {
    opacity: 0;
  }
  .stage.open .card {
    transform: translateY(-230px) scale(1.4);
    z-index: 20;
    box-shadow: 0 35px 80px rgba(0, 0, 0, 0.9);
    pointer-events: auto;
  }

  .hint {
    position: absolute;
    bottom: -45px;
    left: 50%;
    transform: translateX(-50%);
    color: #d4af37;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: opacity 0.4s;
  }
  .stage.open .hint {
    opacity: 0;
  }
</style>
</head>
<body>

<div class="bokeh-container" id="bokeh"></div>

<!-- Flying Birds (Fixed visibility) -->
<div class="bird-container bird-1">
  <svg class="bird-svg" viewBox="0 0 50 40">
    <path class="left-wing" d="M25 20 Q10 0 0 10 Q10 25 25 22" fill="#fffdfa"/>
    <path class="right-wing" d="M25 20 Q40 0 50 10 Q40 25 25 22" fill="#fffdfa"/>
    <ellipse cx="25" cy="21" rx="3.5" ry="9" fill="#f5ede0"/>
  </svg>
</div>
<div class="bird-container bird-2">
  <svg class="bird-svg" viewBox="0 0 50 40">
    <path class="left-wing" d="M25 20 Q10 0 0 10 Q10 25 25 22" fill="#fffdfa"/>
    <path class="right-wing" d="M25 20 Q40 0 50 10 Q40 25 25 22" fill="#fffdfa"/>
    <ellipse cx="25" cy="21" rx="3.5" ry="9" fill="#f5ede0"/>
  </svg>
</div>
<div class="bird-container bird-3">
  <svg class="bird-svg" viewBox="0 0 50 40">
    <path class="left-wing" d="M25 20 Q10 0 0 10 Q10 25 25 22" fill="#fffdfa"/>
    <path class="right-wing" d="M25 20 Q40 0 50 10 Q40 25 25 22" fill="#fffdfa"/>
    <ellipse cx="25" cy="21" rx="3.5" ry="9" fill="#f5ede0"/>
  </svg>
</div>

<div class="stage" id="stage" onclick="openEnvelope(event)">
  <div class="envelope">
    <div class="envelope-back"></div>

    <div class="card" id="card">
      <div class="intro">Avec la bénédiction de leurs parents</div>
      <div class="names">Amir & Lylia</div>
      <div class="details">
        Ont la joie de vous convier à la célébration de leur mariage
        <span class="date">Vendredi 29 Janvier 2027</span>
      </div>
      <a href="https://maps.app.goo.gl/yBpSWSQzhvKGWv729?g_st=ic" target="_blank" class="map-btn" onclick="event.stopPropagation()">
        Voir sur la carte
      </a>
    </div>

    <div class="pocket-left pocket-side"></div>
    <div class="pocket-right pocket-side"></div>
    <div class="pocket-bottom"></div>

    <div class="flap-top">
      <div class="wax-seal">A & L</div>
    </div>
  </div>
  <div class="hint">Appuyez pour ouvrir</div>
</div>

<script>
  // Soft ambient bokeh
  const bokehContainer = document.getElementById('bokeh');
  for (let i = 0; i < 22; i++) {
    const b = document.createElement('div');
    b.className = 'bokeh';
    const size = Math.random() * 90 + 30;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.top = Math.random() * 100 + 'vh';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDelay = (Math.random() * 8) + 's';
    bokehContainer.appendChild(b);
  }

  // Synthesized Harp/Celesta Glissando (Web Audio API)
  function playWeddingChimes() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const notes = [392.00, 493.88, 587.33, 739.99, 783.99, 987.77, 1174.66, 1479.98]; 
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);

        gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0.16, ctx.currentTime + idx * 0.08 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.08 + 2.4);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + idx * 0.08);
        osc.stop(ctx.currentTime + idx * 0.08 + 2.5);
      });
    } catch (e) {
      console.log('Audio disabled:', e);
    }
  }

  let isOpen = false;
  function openEnvelope(e) {
    if (isOpen) return;
    isOpen = true;
    playWeddingChimes();
    document.getElementById('stage').classList.add('open');
  }
</script>

</body>
</html>
